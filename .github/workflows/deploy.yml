name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install all template dependencies
        run: |
          set -e
          for d in public/templates/*/; do
            name=$(basename "$d")
            if [ -f "$d/package-lock.json" ] && [ ! -f "$d/bun.lock" ] && [ ! -f "$d/bun.lockb" ]; then
              echo "==> $name: npm install"
              (cd "$d" && npm install)
            else
              echo "==> $name: bun install"
              (cd "$d" && bun install)
            fi
          done

      - name: Build vanilla templates
        run: |
          set -e
          echo "==> Animations3d"
          (cd public/templates/Animations3d && npm run build)
          echo "==> portfolio-proyecto"
          (cd public/templates/portfolio-proyecto && bun run build)

      - name: Build TanStack templates with SSR previews
        run: node scripts/ssr-previews.js

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ZTemplates/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
