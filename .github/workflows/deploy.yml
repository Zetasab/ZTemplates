name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Animations3d
        working-directory: public/templates/Animations3d
        run: npm install && npm run build

      - name: Build aura-project
        working-directory: public/templates/aura-project
        run: bun install && bun run build

      - name: Build aurum-project
        working-directory: public/templates/aurum-project
        run: bun install && bun run build

      - name: Build kicks-lab-project
        working-directory: public/templates/kicks-lab-project
        run: bun install && bun run build

      - name: Build pharmamodern-project
        working-directory: public/templates/pharmamodern-project
        run: bun install && bun run build

      - name: Build portfolio-proyecto
        working-directory: public/templates/portfolio-proyecto
        run: bun install && bun run build

      - name: Install Angular dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ZTemplates/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
